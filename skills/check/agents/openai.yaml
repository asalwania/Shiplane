# OpenAI Codex adapter. This file supplies the interface metadata Codex shows in
# its agent picker. The skill's actual instructions live in ../SKILL.md, which the
# Agent Skills client installs alongside this file and loads when the skill runs.
interface:
  display_name: "Check"
  short_description: "Verify or review a change before merge"
  default_prompt: "Run the check skill: read its SKILL.md, then verify the change against its spec in a real browser or review the diff for web-specific issues, whichever mode fits."
