# OpenAI Codex adapter. This file supplies the interface metadata Codex shows in
# its agent picker. The skill's actual instructions live in ../SKILL.md, which the
# Agent Skills client installs alongside this file and loads when the skill runs.
interface:
  display_name: "Test"
  short_description: "Write tests for a change just built"
  default_prompt: "Run the test skill: read its SKILL.md and write the test suite for the uncommitted diff, component/unit plus end-to-end if it touches a full user journey."
