# OpenAI Codex adapter. This file supplies the interface metadata Codex shows in
# its agent picker. The skill's actual instructions live in ../SKILL.md, which the
# Agent Skills client installs alongside this file and loads when the skill runs.
interface:
  display_name: "Survey"
  short_description: "Bootstrap AGENTS.md from a real codebase"
  default_prompt: "Run the survey skill: read its SKILL.md, inspect the codebase's stack and conventions, and write AGENTS.md so later skills stop re-deriving them."
