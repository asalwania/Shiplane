# OpenAI Codex adapter. This file supplies the interface metadata Codex shows in
# its agent picker. The skill's actual instructions live in ../SKILL.md, which the
# Agent Skills client installs alongside this file and loads when the skill runs.
interface:
  display_name: "Sync"
  short_description: "Reconcile docs with what shipped"
  default_prompt: "Run the sync skill: read its SKILL.md and make surgical edits to bring AGENTS.md, the scope, and spec statuses back in line with the repository."
