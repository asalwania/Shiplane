# OpenAI Codex adapter. This file supplies the interface metadata Codex shows in
# its agent picker. The skill's actual instructions live in ../SKILL.md, which the
# Agent Skills client installs alongside this file and loads when the skill runs.
interface:
  display_name: "Review"
  short_description: "Fresh-model read of a diff before a PR"
  default_prompt: "Run the review skill: read its SKILL.md, then read the diff cold and flag semantic HTML, CSS architecture, bundle impact, and injection-risk issues."
